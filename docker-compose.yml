version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: santo_domingo_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: santo_domingo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d santo_domingo"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: santo_domingo_backend
    ports:
      - "3264:3264"
    environment:
      PORT: 3264
      DATABASE_URL: postgresql://postgres:postgres@db:5432/santo_domingo?schema=public
      JWT_SECRET: super-secure-token-santo-domingo-2026-!@#
      CORS_ORIGIN: http://localhost:8100,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push && node index.js"

  frontend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: santo_domingo_frontend
    ports:
      - "8100:80"
    depends_on:
      - backend

volumes:
  postgres_data:
